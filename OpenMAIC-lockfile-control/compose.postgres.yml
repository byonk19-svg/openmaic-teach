name: openmaic-native
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: openmaic
      POSTGRES_USER: openmaic
      POSTGRES_PASSWORD: ${OPENMAIC_POSTGRES_PASSWORD:?Set OPENMAIC_POSTGRES_PASSWORD in .env.local}
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - openmaic-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U openmaic -d openmaic']
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
volumes:
  openmaic-postgres:
